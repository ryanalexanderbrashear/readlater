spring.application.name=readlater

spring.datasource.url=jdbc:postgresql://localhost:5433/readlater
spring.datasource.username=readlater
spring.datasource.password=readlater

# Flyway owns the schema. Hibernate must never alter it -- 'validate' makes the
# app fail fast if the entities and the migrations have drifted apart.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Log SQL during development so you can see what JPA actually emits.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
