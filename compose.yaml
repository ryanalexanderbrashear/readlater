services:
  postgres:
    image: postgres:17-alpine
    container_name: readlater-postgres
    environment:
      POSTGRES_DB: readlater
      POSTGRES_USER: readlater
      POSTGRES_PASSWORD: readlater
    ports:
      - "5433:5432"
    volumes:
      - readlater-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readlater -d readlater"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  readlater-pgdata:
